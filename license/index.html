<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>내판역 ↔ 청주운전면허시험장 길찾기 · 1종 면허갱신 가이드</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --naver-green: #03c75a;
      --naver-blue: #1a73e8;
      --bus-branch: #2eb84a;
      --bus-trunk: #2b75ec;
      --bus-express: #e54343;
      --walk-gray: #8f96a0;
      --bg-panel: #ffffff;
      --bg-subtle: #f5f7fa;
      --border: #e5e8ec;
      --text-main: #1b1e23;
      --text-sub: #666c75;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-md: 0 6px 20px rgba(0,0,0,0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      background: var(--bg-subtle);
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Left Side Panel (Naver Map Style) */
    .side-panel {
      width: 430px;
      min-width: 390px;
      height: 100%;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 2px 0 12px rgba(0,0,0,0.06);
    }

    .panel-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .brand-badge {
      background: var(--naver-green);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 6px;
    }
    .dday-pill {
      font-size: 11px;
      font-weight: 700;
      background: #eef5ff;
      color: #1967d2;
      padding: 4px 9px;
      border-radius: 999px;
    }

    /* Mode Tabs */
    .top-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }
    .top-tab {
      border: 1px solid var(--border);
      background: #f8f9fb;
      color: var(--text-sub);
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .top-tab.active {
      background: var(--naver-blue);
      color: #fff;
      border-color: var(--naver-blue);
    }

    /* Route Input Card */
    .od-box {
      position: relative;
      border: 1px solid #d5dae2;
      border-radius: 10px;
      background: #fff;
      overflow: hidden;
    }
    .od-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 48px 10px 12px;
      font-size: 13.5px;
      font-weight: 600;
    }
    .od-row + .od-row {
      border-top: 1px solid var(--border);
    }
    .od-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .od-dot.start { border: 2.5px solid #2eb84a; background: #fff; }
    .od-dot.end { background: #e54343; }
    .od-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .od-tag {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 500;
      margin-left: auto;
      flex-shrink: 0;
    }
    .swap-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-main);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      transition: transform 0.2s, background 0.15s;
    }
    .swap-btn:hover { background: #f3f6fa; }
    .swap-btn:active { transform: translateY(-50%) rotate(180deg); }

    .ext-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .ext-btn {
      text-decoration: none;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: opacity 0.15s;
    }
    .ext-btn:hover { opacity: 0.9; }
    .ext-btn.naver { background: #03c75a; color: #fff; }
    .ext-btn.kakao { background: #fee500; color: #191919; }

    /* Scrollable Body */
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px 28px;
      background: var(--bg-subtle);
    }

    .info-banner {
      background: #fff8e6;
      border: 1px solid #f7dc94;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.5;
      color: #6b4e00;
      margin-bottom: 12px;
    }
    .info-banner strong { color: #473200; }

    /* Route Card */
    .route-card {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .route-card:hover { border-color: #b4c8ea; }
    .route-card.active {
      border-color: var(--naver-blue);
      box-shadow: 0 4px 14px rgba(26, 115, 232, 0.14);
    }

    .route-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .route-badge-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rank-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .rank-tag.best { background: #e8f1ff; color: #1a73e8; }
    .rank-tag.backup { background: #e9f7ef; color: #198754; }
    .rank-tag.alt { background: #f2f4f7; color: #525866; }

    .route-duration {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }
    .route-meta {
      font-size: 12px;
      color: var(--text-sub);
    }

    /* Naver-style Segment Progress Bar */
    .seg-bar {
      display: flex;
      align-items: center;
      height: 16px;
      border-radius: 8px;
      overflow: hidden;
      background: #eceff3;
      margin: 10px 0 12px;
      gap: 1.5px;
    }
    .seg-piece {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      padding: 0 4px;
    }
    .seg-walk { background: var(--walk-gray); color: #fff; }
    .seg-branch { background: var(--bus-branch); }
    .seg-trunk { background: var(--bus-trunk); }
    .seg-express { background: var(--bus-express); }

    /* Step Timeline */
    .step-list {
      position: relative;
      padding-left: 18px;
      margin-top: 6px;
    }
    .step-item {
      position: relative;
      padding-bottom: 11px;
      font-size: 13px;
    }
    .step-item:last-child { padding-bottom: 0; }
    .step-item::before {
      content: "";
      position: absolute;
      left: -13px;
      top: 6px;
      bottom: -6px;
      width: 2px;
      background: #dce1e8;
    }
    .step-item:last-child::before { display: none; }
    .step-dot {
      position: absolute;
      left: -17px;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      border: 2.5px solid var(--bus-trunk);
    }
    .step-dot.branch { border-color: var(--bus-branch); }
    .step-dot.express { border-color: var(--bus-express); }
    .step-dot.end { border-color: #333; background: #333; }

    .step-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .bus-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
      color: #fff;
    }
    .bus-pill.branch { background: var(--bus-branch); }
    .bus-pill.trunk { background: var(--bus-trunk); }
    .bus-pill.express { background: var(--bus-express); }

    .step-sub {
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.45;
    }

    .route-tip {
      margin-top: 10px;
      padding: 8px 10px;
      background: #f5f8fd;
      border-radius: 8px;
      font-size: 12px;
      color: #274c87;
      line-height: 1.45;
    }

    /* Checklist & Guide Tab */
    .guide-section {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .guide-title {
      font-size: 14.5px;
      font-weight: 800;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .progress-text {
      font-size: 12px;
      color: var(--naver-blue);
      font-weight: 700;
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 6px;
      border-bottom: 1px solid #f0f2f5;
      cursor: pointer;
    }
    .check-item:last-child { border-bottom: none; }
    .check-item input {
      margin-top: 3px;
      width: 17px;
      height: 17px;
      accent-color: var(--naver-blue);
      flex-shrink: 0;
    }
    .check-label {
      font-size: 13px;
      line-height: 1.45;
    }
    .check-item.checked .check-label {
      text-decoration: line-through;
      color: #9aa0a6;
    }
    .check-sub {
      display: block;
      font-size: 11.5px;
      color: var(--text-sub);
      margin-top: 2px;
      text-decoration: none !important;
    }

    .fee-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .fee-box {
      background: #f8f9fb;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }
    .fee-box .lbl { font-size: 11.5px; color: var(--text-sub); }
    .fee-box .val { font-size: 15px; font-weight: 800; margin-top: 2px; }

    /* Right Map Container */
    .map-wrap {
      flex: 1;
      position: relative;
      height: 100%;
    }
    #map {
      width: 100%;
      height: 100%;
      background: #e9ecef;
    }

    /* Map Type Controls (Naver Style) */
    .map-controls {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 800;
      display: flex;
      gap: 4px;
      background: rgba(255,255,255,0.96);
      padding: 4px;
      border-radius: 8px;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(0,0,0,0.08);
    }
    .map-type-btn {
      border: none;
      background: transparent;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-sub);
    }
    .map-type-btn.active {
      background: var(--naver-blue);
      color: #fff;
    }

    .map-floating-summary {
      position: absolute;
      bottom: 18px;
      left: 18px;
      z-index: 800;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(6px);
      padding: 10px 14px;
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(0,0,0,0.08);
      font-size: 12.5px;
      max-width: 360px;
    }
    .map-floating-summary strong { color: var(--naver-blue); }

    /* Custom Leaflet POI Marker */
    .poi-marker {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #fff;
      border: 2px solid #2b75ec;
      color: #1b1e23;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 11.5px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.22);
    }
    .poi-marker.start { background: #03c75a; border-color: #fff; color: #fff; }
    .poi-marker.end { background: #e54343; border-color: #fff; color: #fff; }
    .poi-marker.branch { border-color: var(--bus-branch); }
    .poi-marker.express { border-color: var(--bus-express); }

    .mobile-map-toggle {
      display: none;
    }

    @media (max-width: 860px) {
      .app-shell {
        flex-direction: column;
        height: 100dvh;
      }
      .map-wrap {
        order: 1;
        height: 36vh;
        min-height: 220px;
        flex: none;
        transition: height 0.25s ease;
      }
      .map-wrap.collapsed {
        height: 0;
        min-height: 0;
        overflow: hidden;
      }
      .side-panel {
        order: 2;
        width: 100%;
        min-width: 0;
        flex: 1;
        height: auto;
        min-height: 0;
        border-right: none;
        border-top: 1px solid var(--border);
      }
      .map-floating-summary { display: none; }
      .mobile-map-toggle {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border: 1px solid var(--border);
        background: #fff;
        font-size: 11.5px;
        font-weight: 700;
        padding: 4px 8px;
        border-radius: 6px;
        cursor: pointer;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="side-panel">
      <div class="panel-header">
        <div class="brand-row">
          <div class="brand-title">
            <span class="brand-badge">길찾기</span>
            <span>1종 면허갱신 대중교통</span>
          </div>
          <div style="display:flex; gap:6px; align-items:center;">
            <button class="mobile-map-toggle" id="toggleMapBtn" type="button">🗺️ 지도 접기</button>
            <span class="dday-pill">11/24(화) 추천</span>
          </div>
        </div>

        <div class="top-tabs">
          <button class="top-tab active" data-tab="routes" type="button">🚌 대중교통 경로</button>
          <button class="top-tab" data-tab="checklist" type="button">📋 준비물 · 시험장 팁</button>
        </div>

        <div id="odContainer">
          <div class="od-box">
            <div class="od-row">
              <span class="od-dot start"></span>
              <span class="od-label" id="startLabel">내판역 경부선 (버스정류장)</span>
              <span class="od-tag">출발</span>
            </div>
            <div class="od-row">
              <span class="od-dot end"></span>
              <span class="od-label" id="endLabel">한국도로교통공단 청주운전면허시험장</span>
              <span class="od-tag">도착</span>
            </div>
            <button class="swap-btn" id="swapBtn" title="출발/도착 방향 전환" type="button">⇅</button>
          </div>

          <div class="ext-actions">
            <a class="ext-btn naver" id="naverLink" href="#" target="_blank" rel="noopener">N 네이버지도 실시간 열기</a>
            <a class="ext-btn kakao" id="kakaoLink" href="#" target="_blank" rel="noopener">K 카카오맵으로 열기</a>
          </div>
        </div>
      </div>

      <div class="panel-body" id="panelBody"></div>
    </aside>

    <main class="map-wrap" id="mapWrap">
      <div id="map"></div>
      <div class="map-controls">
        <button class="map-type-btn active" data-layer="osm" type="button">일반지도</button>
        <button class="map-type-btn" data-layer="sat" type="button">위성지도</button>
      </div>
      <div class="map-floating-summary" id="mapSummary">
        지도에서 경로와 환승 정류장을 확인하세요.
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    // 주요 지점 실측 좌표 (OpenStreetMap Nominatim 기반)
    const PTS = {
      naepan:   { name: "내판역 (경부선)", lat: 36.558097, lng: 127.324184, desc: "세종시 연동면 내판리 (현금없는버스 - 교통카드 필수)" },
      bugangPS: { name: "부강파출소", lat: 36.531338, lng: 127.365165, desc: "도보 1분 환승 (412번 승차)" },
      bugangSt: { name: "부강역", lat: 36.532056, lng: 127.364736, desc: "도보 2분 환승 (300/18번 ↔ 412번)" },
      jochiwon: { name: "조치원역", lat: 36.601000, lng: 127.297159, desc: "509번(급행) / 502번 기·종점" },
      seopyeong:{ name: "서평리.중봉리", lat: 36.591200, lng: 127.309500, desc: "340번 ↔ 502번 환승 정류장 (도보 1분)" },
      osong:    { name: "오송역", lat: 36.619239, lng: 127.327692, desc: "502/509번 경유" },
      seokgyo:  { name: "석교동", lat: 36.627342, lng: 127.491827, desc: "412번 ↔ 211번 환승 (도보 1분)" },
      yukgeori: { name: "육거리시장", lat: 36.627609, lng: 127.489322, desc: "211번 ↔ 412/407번 환승 (도보 4분)" },
      koreaHosp:{ name: "한국병원", lat: 36.620144, lng: 127.496103, desc: "502번 ↔ 211번 환승 (도보 0분)" },
      yeongun:  { name: "영운동행정복지센터", lat: 36.617590, lng: 127.498591, desc: "509/502번 하차(1245) → 211·213번 승차(1246)" },
      hyeondo:  { name: "현도면행정복지센터", lat: 36.486556, lng: 127.424194, desc: "407번 ↔ 300번 환승 (도보 2분)" },
      namil:    { name: "남일면행정복지센터", lat: 36.586965, lng: 127.509673, desc: "가덕면·시험장 방면 경유" },
      exam:     { name: "청주운전면허시험장", lat: 36.575621, lng: 127.566825, desc: "충북 청주시 상당구 가덕면 교육원로 131-20 (별관 1층 사진·신검)" }
    };

        L.polyline(latlngs, { color: "#ffffff", weight: 8, opacity: 0.9 }).addTo(routeLayerGroup);

          color: colorForType(leg.type),
          weight: 5,
          opacity: 0.95
        }).addTo(routeLayerGroup);

          iconSize: null,
          iconAnchor: [45, 14]
        });

        const marker = L.marker([pt.lat, pt.lng], { icon }).addTo(routeLayerGroup);
        marker.bindPopup(`<strong>${pt.name}</strong><br><span style="font-size:12px;color:#555">${pt.desc}</span>`);
      });

      if (bounds.length) {
        map.fitBounds(bounds, { padding: [45, 45] });
      }

      document.getElementById("mapSummary").innerHTML =
        `<strong>${route.tag} (${route.duration})</strong><br>${route.meta}`;
    }

    function updateODBox() {
      const startEl = document.getElementById("startLabel");
      const endEl = document.getElementById("endLabel");
      const naverEl = document.getElementById("naverLink");
      const kakaoEl = document.getElementById("kakaoLink");

      if (currentDir === "go") {
        startEl.textContent = "내판역 경부선 (세종시 연동면)";
        endEl.textContent = "한국도로교통공단 청주운전면허시험장";
      } else {
        startEl.textContent = "한국도로교통공단 청주운전면허시험장";
        endEl.textContent = "내판역 경부선 (세종시 연동면)";
      }
      naverEl.href = NAVER_URLS[currentDir];
      kakaoEl.href = KAKAO_URLS[currentDir];
    }

    function renderRoutesTab() {
      const list = ROUTES[currentDir];
      if (!list.some((r) => r.id === selectedRouteId)) {
        selectedRouteId = list[0].id;
      }
      const activeRoute = list.find((r) => r.id === selectedRouteId) || list[0];
      drawRouteOnMap(activeRoute);

      const bannerHtml = currentDir === "go"
        ? `<div class="info-banner"><strong>화요일(11/24) 오전 08:30~09:00 출발 추천!</strong><br>별관 <strong>신체검사·사진은 12:00~13:00 점심 중단</strong>입니다. 출발 전 네이버지도 버튼으로 <strong>412번(배차 ~49분)</strong> 실시간 도착을 먼저 확인하세요.</div>`
        : `<div class="info-banner"><strong>귀갓길 (첨부 링크 기준)</strong><br>면허시험장 앞 정류장에서 <strong>211번</strong>(또는 213~216번 영운동행)을 타고 시내로 나온 뒤 부강·조치원 방면으로 환승합니다.</div>`;

      const cardsHtml = list.map((r) => {
        const isActive = r.id === selectedRouteId;
        const barHtml = r.segments.map((s) =>
          `<div class="seg-piece seg-${s.type}" style="flex:${s.flex}" title="${s.label}">${s.label}</div>`
        ).join("");

        const stepsHtml = r.steps.map((st) => {
          const badges = st.badges.map((b) => `<span class="bus-pill ${b.cls}">${b.txt}</span>`).join("");
          return `
            <div class="step-item">
              <span class="step-dot ${st.dot}"></span>
              <div class="step-head"><span>${st.stop}</span>${badges}</div>
              <div class="step-sub">${st.sub}</div>
            </div>
          `;
        }).join("");

        return `
          <div class="route-card ${isActive ? "active" : ""}" data-route-id="${r.id}">
            <div class="route-top">
              <div>
                <div class="route-badge-group">
                  <span class="rank-tag ${r.tagClass}">${r.tag}</span>
                  <span class="route-meta">${r.meta}</span>
                </div>
              </div>
              <div class="route-duration">${r.duration}</div>
            </div>
            <div class="seg-bar">${barHtml}</div>
            <div class="step-list">${stepsHtml}</div>
            <div class="route-tip">💡 ${r.tip}</div>
          </div>
        `;
      }).join("");

      const body = document.getElementById("panelBody");
      body.innerHTML = bannerHtml + cardsHtml;

      body.querySelectorAll(".route-card").forEach((el) => {
        el.addEventListener("click", () => {
          selectedRouteId = el.getAttribute("data-route-id");
          renderRoutesTab();
        });
      });
    }

    function loadCheckedMap() {
      try {
        return JSON.parse(localStorage.getItem("cheongju_license_checks_v1") || "{}");
      } catch {
        return {};
      }
    }

    function saveCheckedMap(mapObj) {
      try {
        localStorage.setItem("cheongju_license_checks_v1", JSON.stringify(mapObj));
      } catch {}
    }

    function renderChecklistTab() {
      const checkedMap = loadCheckedMap();
      const doneCount = CHECKLIST_ITEMS.filter((it) => checkedMap[it.id]).length;

      const itemsHtml = CHECKLIST_ITEMS.map((it) => {
        const isChecked = !!checkedMap[it.id];
        return `
          <label class="check-item ${isChecked ? "checked" : ""}">
            <input type="checkbox" data-check-id="${it.id}" ${isChecked ? "checked" : ""} />
            <span class="check-label">
              <strong>${it.title}</strong>
              <span class="check-sub">${it.sub}</span>
            </span>
          </label>
        `;
      }).join("");

      const body = document.getElementById("panelBody");
      body.innerHTML = `
        <div class="guide-section">
          <div class="guide-title">
            <span>✅ 출발 전 · 현장 체크리스트</span>
            <span class="progress-text">${doneCount} / ${CHECKLIST_ITEMS.length} 완료</span>
          </div>
          <div>${itemsHtml}</div>
        </div>

        <div class="guide-section">
          <div class="guide-title"><span>💳 1종 보통 적성검사(분실 동시) 비용</span></div>
          <div class="fee-grid">
            <div class="fee-box">
              <div class="lbl">일반 면허증 (국문/영문)</div>
              <div class="val">16,000원</div>
            </div>
            <div class="fee-box">
              <div class="lbl">모바일 IC (국문/영문)</div>
              <div class="val">21,000원</div>
            </div>
            <div class="fee-box">
              <div class="lbl">별관 신체검사장</div>
              <div class="val">7,000원 <span style="font-size:11px;font-weight:500;color:#666">(2년내 검진시 0원)</span></div>
            </div>
            <div class="fee-box">
              <div class="lbl">별관 즉석사진</div>
              <div class="val">약 10,000원</div>
            </div>
          </div>
          <div class="route-tip" style="margin-top:10px;">
            분실 상태에서도 <strong>재발급 수수료를 이중으로 내지 않고</strong> 적성검사 수수료 1회만 납부하면 당일 바로 새 면허증이 발급됩니다. (카드 결제 가능 / 예비 현금 2만 원 지참 권장)
          </div>
        </div>

        <div class="guide-section">
          <div class="guide-title"><span>🏛️ 청주운전면허시험장 핵심 정보</span></div>
          <div style="font-size:12.5px; line-height:1.65; color:#333;">
            <div><strong>주소:</strong> 충북 청주시 상당구 가덕면 교육원로 131-20</div>
            <div><strong>운영:</strong> 평일 09:00 ~ 18:00 (토·일·공휴일 휴무)</div>
            <div><strong>주의:</strong> <span style="color:#d93025;font-weight:700;">별관 신체검사·사진은 12:00~13:00 점심 중단</span></div>
            <div><strong>문의:</strong> 1577-1120 (도로교통공단 고객센터)</div>
          </div>
        </div>
      `;

      body.querySelectorAll("input[data-check-id]").forEach((cb) => {
        cb.addEventListener("change", () => {
          const mapObj = loadCheckedMap();
          mapObj[cb.getAttribute("data-check-id")] = cb.checked;
          saveCheckedMap(mapObj);
          renderChecklistTab();
        });
      });
    }

    // Event bindings
    document.querySelectorAll(".top-tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".top-tab").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentTab = btn.getAttribute("data-tab");
        document.getElementById("odContainer").style.display = currentTab === "routes" ? "block" : "none";
        if (currentTab === "routes") renderRoutesTab();
        else renderChecklistTab();
      });
    });

    document.getElementById("swapBtn").addEventListener("click", () => {
      currentDir = currentDir === "go" ? "back" : "go";
      updateODBox();
      renderRoutesTab();
    });

    document.querySelectorAll(".map-type-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".map-type-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const mode = btn.getAttribute("data-layer");
        if (mode === "sat" && mapLayerMode !== "sat") {
          map.removeLayer(osmLayer);
          satLayer.addTo(map);
          mapLayerMode = "sat";
        } else if (mode === "osm" && mapLayerMode !== "osm") {
          map.removeLayer(satLayer);
          osmLayer.addTo(map);
          mapLayerMode = "osm";
        }
      });
    });

    document.getElementById("toggleMapBtn").addEventListener("click", () => {
      const mw = document.getElementById("mapWrap");
      const btn = document.getElementById("toggleMapBtn");
      mw.classList.toggle("collapsed");
      const collapsed = mw.classList.contains("collapsed");
      btn.textContent = collapsed ? "🗺️ 지도 펼치기" : "🗺️ 지도 접기";
      if (!collapsed) setTimeout(() => map.invalidateSize(), 260);
    });

    // Init
    updateODBox();
    renderRoutesTab();
  </script>
</body>
</html>
